[package]
name = "cantrip-host"
description = "The sidecar Cantrip.Server runs the native engine as: the JSON-lines protocol of docs/phase-engine.md, projected per seat."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cantrip_host"

[[bin]]
name = "cantrip-native-host"
path = "src/bin/host.rs"

[dependencies]
cantrip-ai.workspace = true
cantrip-engine.workspace = true
cantrip-oracle.workspace = true
cantrip-obs.workspace = true
cantrip-script.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
