[package]
name = "cantrip-host"
description = "The sidecar Cantrip.Server runs the native engine as: the JSON-lines protocol of docs/phase-engine.md, projected per seat."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cantrip_host"

[[bin]]
name = "cantrip-native-host"
path = "src/bin/host.rs"

[[test]]
name = "ai_record"
required-features = ["ai-record"]

[features]
# The `--ai-record` recorder of training shards for the AI player (docs/host-protocol.md): off in the shipping host,
# which then compiles neither the AI player (tract-onnx) nor zstd. `tools/bot-duel.sh` builds the host with it, and
# `cantrip-ai-host` turns it on, so the workspace's tests run the recorder's.
ai-record = ["dep:cantrip-ai", "dep:cantrip-obs"]

[dependencies]
cantrip-ai = { workspace = true, optional = true }
cantrip-engine.workspace = true
cantrip-oracle.workspace = true
cantrip-obs = { workspace = true, optional = true }
cantrip-script.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The rules a test card's effect is written against (`cantrip_api::Game`), which `cantrip_engine` names `Game` for the engine's.
cantrip-api.workspace = true
cantrip-state.workspace = true
