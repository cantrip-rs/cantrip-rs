[package]
name = "cantrip-ai-host"
description = "The AI player as a process beside the table: it mirrors a hosted game and answers a seat's requests with a network (docs/ai-host.md)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cantrip_ai_host"

[[bin]]
name = "cantrip-ai-host"
path = "src/main.rs"

[[bin]]
name = "cantrip-selfplay"
path = "src/bin/selfplay.rs"

[[bin]]
name = "cantrip-regret"
path = "src/bin/regret.rs"

[[bin]]
name = "cantrip-infer"
path = "src/bin/infer.rs"
required-features = ["gpu"]

[dependencies]
cantrip-ai.workspace = true
cantrip-engine.workspace = true
# With its recorder (`ai-record`): the AI tools are where it is used, and so `cargo test --workspace` runs its tests.
cantrip-host = { workspace = true, features = ["ai-record"] }
cantrip-obs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# onnxruntime on the CPU, the faster backend (`cantrip_ai::eval::OrtEvaluator`); tract otherwise.
ort = ["cantrip-ai/ort"]
# The GPU engine: cantrip-infer, the native inference server, and self-play's `--backend gpu` (onnxruntime-gpu loaded
# at run time; docs/ai-host.md).
gpu = ["ort", "cantrip-ai/gpu"]

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
